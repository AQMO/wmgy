server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orchard_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"   # 请修改为你本机 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # 启动时自动建表/更新表结构
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # 生产环境请通过环境变量覆盖，且不少于 32 字符
  secret: orchard-platform-jwt-secret-key-2026-must-be-long-enough
  expire-hours: 24

wx:
  # 微信小程序：留空走开发模式(mock 登录)，填入正式 AppID/Secret 后走真实 wx.login
  appid: ""
  secret: ""

logging:
  level:
    com.orchard: info
